y","Yêu cầu kiểm tra nhớ":"Hỏi 3 giờ mà không nhìn mẫu","Dùng từ tuần":"1"},{"#":3,"Nhóm":"Clarify","Tình huống (mặt trước)":"Bạn chưa nghe rõ","Mẫu câu gợi ý (mặt sau)":"Could you repeat that, please?","Cách biến thể":"repeat that → say it more slowly","Yêu cầu kiểm tra nhớ":"Dùng ngay trong AI role-play","Dùng từ tuần":"1"},{"#":4,"Nhóm":"Clarify","Tình huống (mặt trước)":"Bạn muốn xác nhận yêu cầu","Mẫu câu gợi ý (mặt sau)":"Just to confirm, do you mean this file?","Cách biến thể":"file → endpoint / request / meeting","Yêu cầu kiểm tra nhớ":"Tạo 3 câu hỏi xác nhận khác nhau","Dùng từ tuần":"1"},{"#":5,"Nhóm":"Work","Tình huống (mặt trước)":"Bạn đang làm API","Mẫu câu gợi ý (mặt sau)":"I am working on the login API.","Cách biến thể":"login API → database connection / testing","Yêu cầu kiểm tra nhớ":"Nói 5 câu thay thế","Dùng từ tuần":"1"},{"#":6,"Nhóm":"Work","Tình huống (mặt trước)":"Bạn đã sửa xong lỗi","Mẫu câu gợi ý (mặt sau)":"I fixed the login issue yesterday.","Cách biến thể":"login issue → typo / connection problem","Yêu cầu kiểm tra nhớ":"Phân biệt yesterday vs today","Dùng từ tuần":"1"},{"#":7,"Nhóm":"Work","Tình huống (mặt trước)":"Bạn sẽ làm gì hôm nay","Mẫu câu gợi ý (mặt sau)":"Today, I am going to test the endpoint.","Cách biến thể":"test endpoint → review code","Yêu cầu kiểm tra nhớ":"Nói dự định 2 câu","Dùng từ tuần":"1"},{"#":8,"Nhóm":"Work","Tình huống (mặt trước)":"Bạn có trở ngại","Mẫu câu gợi ý (mặt sau)":"I am blocked by a database issue.","Cách biến thể":"database issue → missing access / failing test","Yêu cầu kiểm tra nhớ":"Nêu blocker + người cần hỗ trợ","Dùng từ tuần":"2"},{"#":9,"Nhóm":"Help","Tình huống (mặt trước)":"Bạn muốn xin hỗ trợ","Mẫu câu gợi ý (mặt sau)":"Could you take a look at this code?","Cách biến thể":"code → error / query","Yêu cầu kiểm tra nhớ":"Nói lịch sự trong role-play","Dùng từ tuần":"2"},{"#":10,"Nhóm":"Help","Tình huống (mặt trước)":"Bạn đã thử cách xử lý","Mẫu câu gợi ý (mặt sau)":"I have already checked the logs.","Cách biến thể":"checked the logs → restarted the service","Yêu cầu kiểm tra nhớ":"Nêu 2 điều đã làm","Dùng từ tuần":"2"},{"#":11,"Nhóm":"Help","Tình huống (mặt trước)":"Bạn cần thêm dữ liệu","Mẫu câu gợi ý (mặt sau)":"Could you share the error message?","Cách biến thể":"error message → steps to reproduce","Yêu cầu kiểm tra nhớ":"Hỏi 2 câu để gỡ lỗi","Dùng từ tuần":"2"},{"#":12,"Nhóm":"Plan","Tình huống (mặt trước)":"Bạn không thể dự họp","Mẫu câu gợi ý (mặt sau)":"I cannot attend the meeting today.","Cách biến thể":"meeting → interview / training","Yêu cầu kiểm tra nhớ":"Xin phép và đề xuất thay thế","Dùng từ tuần":"2"},{"#":13,"Nhóm":"Plan","Tình huống (mặt trước)":"Bạn đề xuất cách khác","Mẫu câu gợi ý (mặt sau)":"What if we try another approach?","Cách biến thể":"another approach → simpler solution","Yêu cầu kiểm tra nhớ":"Dùng trong tình huống PM","Dùng từ tuần":"2"},{"#":14,"Nhóm":"Plan","Tình huống (mặt trước)":"Bạn thông báo thay đổi","Mẫu câu gợi ý (mặt sau)":"The deadline has been moved to Monday.","Cách biến thể":"Monday → Friday","Yêu cầu kiểm tra nhớ":"Nói lại thời điểm và tác động","Dùng từ tuần":"2"},{"#":15,"Nhóm":"Feedback","Tình huống (mặt trước)":"Bạn đồng ý một phần","Mẫu câu gợi ý (mặt sau)":"I see your point, but I have a concern.","Cách biến thể":"concern → question / suggestion","Yêu cầu kiểm tra nhớ":"Dùng 1 lý do sau but","Dùng từ tuần":"3"},{"#":16,"Nhóm":"Feedback","Tình huống (mặt trước)":"Bạn hiểu ý đồng nghiệp","Mẫu câu gợi ý (mặt sau)":"That makes sense to me.","Cách biến thể":"That makes sense → I agree with that","Yêu cầu kiểm tra nhớ":"Đưa lý do cụ thể, không chỉ nói yes","Dùng từ tuần":"3"},{"#":17,"Nhóm":"Feedback","Tình huống (mặt trước)":"Bạn muốn nói rõ hơn","Mẫu câu gợi ý (mặt sau)":"Let me explain what I mean.","Cách biến thể":"explain → give an example","Yêu cầu kiểm tra nhớ":"Tự đưa 1 ví dụ","Dùng từ tuần":"3"},{"#":18,"Nhóm":"Feedback","Tình huống (mặt trước)":"Bạn thấy khó khăn","Mẫu câu gợi ý (mặt sau)":"One possible problem is the slow response.","Cách biến thể":"slow response → invalid request","Yêu cầu kiểm tra nhớ":"Nêu vấn đề và hậu quả","Dùng từ tuần":"3"},{"#":19,"Nhóm":"Story","Tình huống (mặt trước)":"Bạn bắt đầu kể khó khăn","Mẫu câu gợi ý (mặt sau)":"At first, the endpoint did not work.","Cách biến thể":"endpoint → connection","Yêu cầu kiểm tra nhớ":"Kể thêm then/finally","Dùng từ tuần":"3"},{"#":20,"Nhóm":"Story","Tình huống (mặt trước)":"Bạn đã xử lý thành công","Mẫu câu gợi ý (mặt sau)":"Eventually, I found the cause and fixed it.","Cách biến thể":"cause → configuration issue","Yêu cầu kiểm tra nhớ":"Nói 3 bước xử lý","Dùng từ tuần":"3"},{"#":21,"Nhóm":"API","Tình huống (mặt trước)":"Bạn giải thích client/server","Mẫu câu gợi ý (mặt sau)":"The client sends a request to the server.","Cách biến thể":"request → HTTP GET request","Yêu cầu kiểm tra nhớ":"Giải thích bằng sơ đồ lời 3 bước","Dùng từ tuần":"5"},{"#":22,"Nhóm":"API","Tình huống (mặt trước)":"Bạn giải thích response","Mẫu câu gợi ý (mặt sau)":"The server returns a JSON response.","Cách biến thể":"JSON response → error message","Yêu cầu kiểm tra nhớ":"So sánh request và response","Dùng từ tuần":"5"},{"#":23,"Nhóm":"API","Tình huống (mặt trước)":"Bạn nói mục đích endpoint","Mẫu câu gợi ý (mặt sau)":"This endpoint allows users to log in.","Cách biến thể":"log in → create an account","Yêu cầu kiểm tra nhớ":"Nói 2 endpoints thực tế","Dùng từ tuần":"5"},{"#":24,"Nhóm":"API","Tình huống (mặt trước)":"Bạn giải thích kiểm tra token","Mẫu câu gợi ý (mặt sau)":"The API checks the token before returning data.","Cách biến thể":"token → user role","Yêu cầu kiểm tra nhớ":"Thêm câu if token invalid","Dùng từ tuần":"5"},{"#":25,"Nhóm":"API","Tình huống (mặt trước)":"Bạn giải thích auth","Mẫu câu gợi ý (mặt sau)":"Authentication verifies a user’s identity.","Cách biến thể":"authentication → authorization","Yêu cầu kiểm tra nhớ":"Phân biệt 2 khái niệm bằng câu ngắn","Dùng từ tuần":"6"},{"#":26,"Nhóm":"Database","Tình huống (mặt trước)":"Bạn giải thích nơi lưu dữ liệu","Mẫu câu gợi ý (mặt sau)":"User data is stored in the database.","Cách biến thể":"User data → account information","Yêu cầu kiểm tra nhớ":"Nêu 1 ví dụ cụ thể","Dùng từ tuần":"6"},{"#":27,"Nhóm":"Database","Tình huống (mặt trước)":"Bạn nói query quá chậm","Mẫu câu gợi ý (mặt sau)":"The query might be too slow.","Cách biến thể":"query → API / network","Yêu cầu kiểm tra nhớ":"Nêu cách kiểm tra sau câu này","Dùng từ tuần":"6"},{"#":28,"Nhóm":"Debug","Tình huống (mặt trước)":"Bạn mô tả triệu chứng lỗi","Mẫu câu gợi ý (mặt sau)":"The connection times out when I call the API.","Cách biến thể":"call the API → run the test","Yêu cầu kiểm tra nhớ":"Tạo câu điều kiện when khác","Dùng từ tuần":"6"},{"#":29,"Nhóm":"Debug","Tình huống (mặt trước)":"Bạn nói nguyên nhân chưa chắc chắn","Mẫu câu gợi ý (mặt sau)":"It may be caused by a wrong configuration.","Cách biến thể":"configuration → missing environment variable","Yêu cầu kiểm tra nhớ":"Tránh khẳng định nếu chưa xác minh","Dùng từ tuần":"6"},{"#":30,"Nhóm":"Debug","Tình huống (mặt trước)":"Bạn đề xuất kiểm chứng","Mẫu câu gợi ý (mặt sau)":"I will check the logs and run the test again.","Cách biến thể":"logs → database settings","Yêu cầu kiểm tra nhớ":"Nói 2 bước tiếp theo","Dùng từ tuần":"6"},{"#":31,"Nhóm":"Interview","Tình huống (mặt trước)":"Bạn giới thiệu ngành học","Mẫu câu gợi ý (mặt sau)":"I study information technology and focus on backend development.","Cách biến thể":"backend → web development","Yêu cầu kiểm tra nhớ":"Nói một câu giới thiệu 20 giây","Dùng từ tuần":"7"},{"#":32,"Nhóm":"Interview","Tình huống (mặt trước)":"Bạn nói kinh nghiệm thực hành","Mẫu câu gợi ý (mặt sau)":"I have worked with Java and Spring Boot.","Cách biến thể":"Java/Spring → MySQL/Docker","Yêu cầu kiểm tra nhớ":"Đưa dự án minh họa","Dùng từ tuần":"7"},{"#":33,"Nhóm":"Interview","Tình huống (mặt trước)":"Bạn trình bày dự án","Mẫu câu gợi ý (mặt sau)":"My project helps educational centers manage user 9px"><div class="row between wrap"><div><div class="eyebrow">KẾT THÚC BUỔI HỌC</div><h3 style="font-size:17px;margin:4px 0">Xác nhận ngày ${d}</h3><p class="small subtle" style="margin:5px 0 0">Hãy lưu nhật ký ở cột bên phải, rồi đánh dấu ngày hoàn thành.</p></div><button class="btn ${dayDone(d)?'soft':'primary'}" onclick="markDay(${d})">${ico('check',18)} ${dayDone(d)?'Đã hoàn thành · hoàn tác':'Hoàn thành ngày này'}</button></div></div></div>

<section class="card"><div class="section-title">Nhật ký ngày ${d}<span class="tag">Tự lưu</span></div><div class="grid2" style="gap:10px"><div class="form-field"><label>Phút thực học</label><input id="f-minutes" type="number" min="0" max="600" value="${safe(log.minutes??'')}" placeholder="${mins()}" oninput="updateLog(${d},'minutes',this.value)"></div><div class="form-field"><label>Phút nói thực tế</label><input id="f-speech" type="number" min="0" max="180" value="${safe(log.speech??'')}" placeholder="Ví dụ: 12" oninput="updateLog(${d},'speech',this.value)"></div><div class="form-field"><label>Listening /10</label><input id="f-listening" type="number" min="0" max="10" step="0.5" value="${safe(log.listening??'')}" placeholder="0–10" oninput="updateLog(${d},'listening',this.value)"></div><div class="form-field"><label>Speaking /20</label><input id="f-speaking" type="number" min="0" max="20" step="0.5" value="${safe(log.speaking??'')}" placeholder="Chỉ khi đánh giá" oninput="updateLog(${d},'speaking',this.value)"></div>${isTest?`<div class="form-field"><label>Reading /5</label><input type="number" min="0" max="5" step="0.5" value="${safe(log.reading??'')}" placeholder="0–5" oninput="updateLog(${d},'reading',this.value)"></div><div class="form-field"><label>Writing /12</label><input type="number" min="0" max="12" step="0.5" value="${safe(log.writing??'')}" placeholder="0–12" oninput="updateLog(${d},'writing',this.value)"></div>`:''}</div><div class="form-field" style="margin-top:12px"><label>Lỗi cần sửa và nhận xét</label><textarea id="f-notes" placeholder="Ví dụ: nghe thiếu âm cuối; nói Past Simple chưa đúng..." oninput="updateLog(${d},'notes',this.value)">${safe(log.notes??'')}</textarea></div><p class="tiny subtle" style="margin:9px 0 0">Điểm Listening chỉ nên nhập khi làm bài mới/chưa học. Điểm Speaking /20 cần có rubric đánh giá.</p></section>${d>=15&&d<=60?`<div class="notice">${ico('flag',15)} <b>Lưu ý chuyển cấp:</b> Nếu chưa đủ vững A2 hoặc gặp khó khi nghe bài B1, chọn bài A2 phù hợp để thay thế; nội dung Excel V3 có một số bài B1 không kèm link A2 dự phòng.</div>`:''}</div></div>`;}
function updateLog(day,key,value){const d=dayLog(day);if(['minutes','speech','listening','speaking','reading','writing'].includes(key)){if(value===''||value==null)delete d[key];else d[key]=Number(value)}else d[key]=value;save()}
let roadmapWeek=0,roadmapQuery='';
function roadmap(){let weeks=roadmapWeek?data.weeks.filter(w=>+w['Tuần']===roadmapWeek):data.weeks;let q=roadmapQuery.trim().toLowerCase();return `<h1 class="page-title">Bản đồ học tập 60 ngày</h1><p class="lead">Chọn một ngày để mở toàn bộ bài học và từng bước thực hành. Nội dung được lấy từ LO_TRINH_60_NGAY của bản Excel V3.</p><div class="roadmap-controls"><div class="tabs">${[['0','Tất cả'],...data.weeks.map(w=>[String(w['Tuần']),'Tuần '+w['Tuần']])].map(([id,label])=>`<button onclick="roadmapWeek=${+id};render()" class="${roadmapWeek===+id?'active':''}">${label}</button>`).join('')}</div><input class="search" type="search" placeholder="Tìm chủ đề, bài nghe, ngày..." value="${safe(roadmapQuery)}" oninput="roadmapQuery=this.value;render();const z=document.querySelector('.search');z.focus();z.setSelectionRange(z.value.length,z.value.length)"></div>${weeks.map(w=>{const days=data.plans.filter(d=>+d['Tuần']===+w['Tuần']&&(!q||[d['Ngày'],d['Chủ đề'],d['Bài Listening'],d['Bài Speaking'],d['Mức đích']].some(v=>plain(v).toLowerCase().includes(q))));if(!days.length)return '';return `<section class="card" style="margin-bottom:17px"><div class="week-header"><div><div class="eyebrow">TUẦN ${w['Tuần']} · NGÀY ${safe(w['Ngày'])}</div><div class="h">${safe(w['Mục tiêu tuần'])}</div></div><span class="tag ${plain(w['Mức']).includes('B1')?'b1':'a2'}">${safe(w['Mức'])}</span></div><div class="week-objective"><b>Điều kiện hoàn thành:</b> ${safe(w['Tiêu chí hoàn thành'])}</div><div class="day-grid">${days.map(d=>`<button class="day-tile ${dayDone(d['Ngày'])?'isdone':''}" onclick="goDay(${+d['Ngày']})"><div class="row between"><span class="day-number">NGÀY ${String(d['Ngày']).padStart(2,'0')}</span>${dayDone(d['Ngày'])?ico('check',16):assessmentDays.includes(d['Ngày'])?ico('flag',16):ico('right',14)}</div><div class="day-topic">${safe(d['Chủ đề'])}</div><div class="tile-foot"><span>${safe(d['Mức đích'])}</span><span>${taskCompleted(d['Ngày'])}/${taskData(d['Ngày']).length}</span></div></button>`).join('')}</div></section>`}).join('')||'<div class="empty">Không tìm thấy bài phù hợp.</div>'}`;}
let libQuery='',libLevel='all',libType='all';
function library(){const levels=[...new Set(data.resources.map(r=>plain(r['Trình độ'])).filter(Boolean))];const types=[...new Set(data.resources.map(r=>plain(r['Loại'])).filter(Boolean))];const rows=data.resources.filter(r=>(libLevel==='all'||r['Trình độ']===libLevel)&&(libType==='all'||r['Loại']===libType)&&[r['Tên bài / tài nguyên'],r['Loại'],r['Trình độ'],r['Cách học cụ thể']].some(x=>plain(x).toLowerCase().includes(libQuery.toLowerCase())));return `<h1 class="page-title">Thư viện tài liệu</h1><p class="lead">${data.resources.length} tài liệu và bài học được giữ từ Excel V3. Link mở sang website của nhà cung cấp; cần Internet để nghe hoặc làm bài.</p><div class="roadmap-controls"><input class="search" type="search" placeholder="Tìm tên bài, kỹ năng..." value="${safe(libQuery)}" oninput="libQuery=this.value;render();const z=document.querySelector('.search');z.focus();z.setSelectionRange(z.value.length,z.value.length)"><select class="select-small" onchange="libLevel=this.value;render()"><option value="all">Tất cả mức độ</option>${levels.map(l=>`<option value="${safe(l)}" ${libLevel===l?'selected':''}>${safe(l)}</option>`).join('')}</select><select class="select-small" onchange="libType=this.value;render()"><option value="all">Tất cả kỹ năng</option>${types.map(l=>`<option value="${safe(l)}" ${libType===l?'selected':''}>${safe(l)}</option>`).join('')}</select><span class="subtle tiny">${rows.length} kết quả</span></div><div class="grid3">${rows.map(r=>`<article class="card res-card"><div class="row between"><span class="tag ${plain(r['Trình độ']).includes('B1')?'b1':'a2'}">${safe(r['Trình độ'])}</span><span class="tiny subtle">${safe(r['Mã'])}</span></div><div class="res-title">${safe(r['Tên bài / tài nguyên'])}</div><div class="tiny subtle">${safe(r['Loại'])} · Dùng từ ngày ${safe(r['Dùng từ ngày'])}</div><div class="res-details"><b>Cách học:</b> ${safe(r['Cách học cụ thể'])}</div><div class="res-foot">${safeUrl(r['Đường dẫn nguồn'])?`<a class="btn soft mini" href="${safe(safeUrl(r['Đường dẫn nguồn']))}" target="_blank" rel="noopener">${ico('external',14)} Mở bài</a>`:'<span class="subtle tiny">Không có liên kết</span>'}<button class="btn mini" onclick="copyText(decodeURIComponent('${quoted(r['Tên bài / tài nguyên'])}'))">${ico('copy',13)} Tên bài</button></div></article>`).join('')}</div>${rows.length?'':'<div class="empty">Không có tài liệu khớp điều kiện.</div>'}`;}
function methods(){return `<h1 class="page-title">Phương pháp học đúng cách</h1><p class="lead">Khi đã quen quy trình, chỉ cần vào trang “Học hôm nay”. Trang này giải thích sâu các phương pháp đang áp dụng trong lịch chi tiết.</p><div class="grid2">${data.methods.map((m,i)=>`<details class="card method-card" ${i===0?'open':''}><summary><span>${safe(m['Phương pháp'])} <span class="tiny subtle" style="display:block;font-weight:500">${safe(m['Phù hợp'])} · ${safe(m['Thời lượng'])}</span></span>${ico('chev',17)}</summary><div class="method-card-body"><div><span class="eyebrow">MỤC ĐÍCH</span><p>${safe(m['Mục đích'])}</p></div><div><span class="eyebrow">THỰC HIỆN</span>${formatSteps(m['Các bước thực hành'])}</div><div class="outcome"><strong>SẢN PHẨM</strong><p>${safe(m['Đầu ra phải lưu'])}</p></div><div class="criteria"><b>Chỉ số:</b> ${safe(m['Chỉ số tự kiểm'])}</div><div class="criteria"><b>Tránh:</b> ${safe(m['Sai lầm cần tránh'])}</div></div></details>`).join('')}</div>`;}
let ankiIndex=0,ankiFlipped=false,ankiGroup='all';
function anki(){const groups=[...new Set(data.anki.map(r=>r['Nhóm']))],list=data.anki.filter(r=>ankiGroup==='all'||r['Nhóm']===ankiGroup);const i=Math.min(list.length-1,Math.max(0,ankiIndex));ankiIndex=i;const r=list[i];return `<h1 class="page-title">Anki · Luyện cụm từ theo tình huống</h1><p class="lead">${data.anki.length} thẻ mẫu có trong Excel V3. Nhìn tình huống, <b>tự nói câu trả lời</b>, sau đó lật thẻ để đối chiếu. Đây là bộ thẻ ôn trực tiếp trên web, không đồng bộ với Anki.</p><div class="columns"><div class="stack"><div class="card"><div class="row between wrap" style="margin-bottom:18px"><select class="select-small" onchange="ankiGroup=this.value;ankiIndex=0;ankiFlipped=false;render()"><option value="all">Tất cả nhóm</option>${groups.map(g=>`<option ${ankiGroup===g?'selected':''}>${safe(g)}</option>`).join('')}</select><span class="small subtle">Thẻ <b>${i+1}</b> / ${list.length}</span></div><div class="flashcard ${ankiFlipped?'back':''}" role="button" tabindex="0" onclick="ankiFlipped=!ankiFlipped;render()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ankiFlipped=!ankiFlipped;render()}"><div><div class="flash-cap">${ankiFlipped?'CÂU TRẢ LỜI GỢI Ý':'TÌNH HUỐNG · TỰ NÓI TRƯỚC'}</div><div class="flash-text" style="margin-top:18px">${safe(ankiFlipped?r['Mẫu câu gợi ý (mặt sau)']:r['Tình huống (mặt trước)'])}</div><div style="margin-top:14px;font-size:12px;opacity:.78">Nhấn để ${ankiFlipped?'xem lại câu hỏi':'lật thẻ'}</div></div></div><div class="row between" style="margin-top:15px"><button class="btn" onclick="ankiIndex=Math.max(0,ankiIndex-1);ankiFlipped=false;render()" ${i===0?'disabled':''}>${ico('left',16)} Trước</button><button class="btn soft" onclick="ankiFlipped=!ankiFlipped;render()">${ico('refresh',16)} Lật thẻ</button><button class="btn primary" onclick="ankiIndex=Math.min(${list.length-1},ankiIndex+1);ankiFlipped=false;render()" ${i===list.length-1?'disabled':''}>Tiếp ${ico('right',16)}</button></div></div></div><div class="stack"><div class="card"><div class="section-title">Vận dụng câu</div><div class="eyebrow">BIẾN THỂ</div><p>${safe(r['Cách biến thể'])}</p><div class="divider"></div><div class="eyebrow">ĐIỀU KIỆN NHỚ</div><p>${safe(r['Yêu cầu kiểm tra nhớ'])}</p><div class="divider"></div><p class="small subtle">Nguồn Excel: nhóm <b>${safe(r['Nhóm'])}</b>, dùng từ tuần ${safe(r['Dùng từ tuần'])}.</p><button class="btn soft" onclick="copyText(decodeURIComponent('${quoted(plain(r['Tình huống (mặt trước)'])+'\n'+plain(r['Mẫu câu gợi ý (mặt sau)']))}'))">${ico('copy',15)} Sao chép mặt trước/sau</button></div><div class="notice">Thẻ này dùng để luyện Retrieval Practice. Lịch nhắc ôn thực tế vẫn nên thực hiện trên ứng dụng Anki nếu bạn đã dùng.</div></div></div>`;}
function tests(){const rr=data.rubric;return `<h1 class="page-title">Đánh giá tiến bộ</h1><p class="lead">7 mốc kiểm tra của V3: ngày 1, 7, 14, 21, 30, 45 và 60. Mỗi lần kiểm tra nên dùng nội dung chưa học trước đó.</p><div class="grid2">${data.assess.map(r=>{const d=+r['Ngày'],log=dayLog(d);return `<article class="card"><div class="row between"><div><span class="eyebrow">CHECKPOINT · NGÀY ${d}</span><h3 style="margin:5px 0 8px;font-size:17px">${safe(r['Giai đoạn'])}</h3></div><span class="tag ${dayDone(d)?'a2':'test'}">${dayDone(d)?'Đã học':'Chưa hoàn thành'}</span></div><div class="assessment-item"><strong>LISTENING</strong><p>${safe(r['Nghe: nội dung'])}</p></div><div class="assessment-item"><strong>SPEAKING</strong><p>${safe(r['Nói: nhiệm vụ'])}</p></div><div class="assessment-item"><strong>READING + WRITING</strong><p>${safe(r['Đọc: nhiệm vụ'])}</p><p>${safe(r['Viết: nhiệm vụ'])}</p></div><div class="tiny subtle" style="margin-bottom:12px"><b>Quan sát:</b> ${safe(r['Chuẩn quan sát'])}</div><div class="row between wrap"><span class="tiny">Listening: <b>${safe(log.listening??'—')}/10</b> · Speaking: <b>${safe(log.speaking??'—')}/20</b></span><button class="btn mini soft" onclick="goDay(${d})">Làm bài kiểm tra ${ico('right',14)}</button></div></article>`}).join('')}</div><section class="card" style="margin-top:18px"><div class="section-title">Rubric Speaking và nguyên tắc chuyển cấp</div><div class="rubric">${rr.map(r=>`<div><b>${safe(r['Ngày'])}</b> ${safe(r['Giai đoạn'])}</div>`).join('')}</div><div class="top-alert" style="margin-top:17px">Đây là thang tự theo dõi. Điểm số không tự xác nhận trình độ CEFR chính thức.</div></section>`;}
function prompts(){return `<h1 class="page-title">Luyện Speaking với ChatGPT</h1><p class="lead">6 prompt có sẵn trong Excel V3. Chọn theo chủ đề, sao chép vào ChatGPT rồi bắt đầu hội thoại bằng Voice.</p><div class="stack">${data.prompts.map(r=>`<article class="prompt-card"><div class="row between wrap"><div><span class="tag">${safe(r['Mã'])}</span><b style="margin-left:9px">${safe(r['Khi dùng'])}</b></div><button class="btn mini soft" onclick="copyText(decodeURIComponent('${quoted(r['Prompt có thể copy nguyên văn'])}'))">${ico('copy',15)} Sao chép prompt</button></div><div class="prompt-code" style="margin-top:13px">${safe(r['Prompt có thể copy nguyên văn'])}</div><p class="small subtle"><b>Sau buổi:</b> ${safe(r['Điểm cần ghi sau buổi'])}</p></article>`).join('')}</div>`;}
function settings(){return `<h1 class="page-title">Cài đặt & dữ liệu</h1><p class="lead">Trang web chạy offline, dữ liệu tiến độ lưu trong bộ nhớ cục bộ của trình duyệt. Không đăng nhập, không tự gửi kết quả lên máy chủ.</p><div class="columns"><div class="stack"><section class="card"><div class="section-title">Chế độ học</div><div class="form-field"><label>Thời lượng học mặc định</label><select onchange="modeChange(this.value)">${[40,60,90].map(n=>`<option value="${n}" ${mins()===n?'selected':''}>${n} phút / ngày</option>`).join('')}</select></div><div class="form-field" style="margin-top:14px"><label>Ngày bắt đầu</label><input type="date" value="${safe(app.pref.startDate)}" onchange="app.pref.startDate=this.value;save();render()"></div><div class="form-field" style="margin-top:14px"><label>Ngày đang học</label><select onchange="app.pref.selectedDay=+this.value;save();render()">${data.plans.map(p=>`<option value="${p['Ngày']}" ${app.pref.selectedDay==p['Ngày']?'selected':''}>Ngày ${p['Ngày']}: ${safe(p['Chủ đề'])}</option>`).join('')}</select></div><button class="btn primary" style="margin-top:15px" onclick="go('today')">${ico('book',16)} Mở buổi học</button></section><section class="card"><div class="section-title">Sao lưu và khôi phục</div><p class="small subtle">Xuất kết quả để tránh mất dữ liệu khi đổi trình duyệt, xóa dữ liệu website hoặc chuyển máy.</p><div class="row wrap"><button class="btn primary" onclick="exportProgress()">${ico('download',17)} Xuất dữ liệu JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">${ico('save',17)} Nhập bản sao lưu</button></div><div class="divider"></div><button class="btn danger" onclick="resetProgress()">${ico('refresh',16)} Xóa tiến độ trong trình duyệt</button></section></div><div class="stack"><section class="card"><div class="section-title">Nguồn nội dung</div><p><b>Lo_trinh_tieng_Anh_A2_den_B1_60_ngay_v3.xlsx</b></p><p class="small subtle">Đã chuyển từ workbook V3: 60 ngày, ${data.tasks.length} hoạt động chi tiết, ${data.resources.length} mục tài liệu, ${data.methods.length} phương pháp, ${data.anki.length} thẻ mẫu, ${data.prompts.length} prompt.</p><div class="notice">Các liên kết British Council, DailyDictation, MDN và website khác mở ngoài trình duyệt và cần kết nối Internet. Thông tin nguồn được giữ theo file gốc; link có thể thay đổi theo thời gian.</div></section><section class="card"><div class="section-title">Giới hạn của phiên bản offline</div><ul class="summary-list"><li>Lưu kết quả theo trình duyệt/thiết bị, không có đồng bộ trực tuyến.</li><li>Không tự lấy điểm từ các website bên ngoài.</li><li>Không ghi âm hay phát âm thanh trong website; dùng công cụ nguồn và ChatGPT Voice.</li><li>Không sửa ngược file Excel gốc.</li></ul></section></div></div>`;}
function exportProgress(){const txt=JSON.stringify({schema:'english-sprint-v3-progress',exportedAt:new Date().toISOString(),progress:app},null,2),blob=new Blob([txt],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='english_sprint_progress_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Đã xuất dữ liệu tiến độ')}
function importProgress(e){const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(reader.result);if(o.schema!=='english-sprint-v3-progress'||!o.progress||!o.progress.pref||!o.progress.days||!o.progress.tasks)throw Error('Cấu trúc tệp không hợp lệ');if(!confirm('Nhập dữ liệu này sẽ thay thế tiến độ hiện tại. Tiếp tục?'))return;app=o.progress;save();render();toast('Đã khôi phục dữ liệu')}catch(ex){toast('Không thể nhập: '+ex.message)}finally{e.target.value=''}};reader.readAsText(f)}
function resetProgress(){if(!confirm('Xóa toàn bộ ngày hoàn thành, điểm và ghi chú trên trình duyệt này? Bạn nên xuất bản sao lưu trước.'))return;app=structuredClone(initial);save();render();toast('Đã đặt lại tiến độ')}
function init(){document.getElementById('logoI').innerHTML=ico('book',24);document.getElementById('iconNow').innerHTML=ico('play',14);window.addEventListener('hashchange',render);if(!location.hash)location.hash='#/dashboard';render()}
init();
</script>
